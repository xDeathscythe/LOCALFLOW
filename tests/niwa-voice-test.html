<!doctype html><meta charset="utf-8"><title>LocalFlow duplex test</title><script>
let peer, context, oscillator, destination;
window.voiceState = 'idle';
window.voiceTest.onSdp(async sdp => { await peer.setRemoteDescription({type:'answer',sdp}); });
window.startTest = async () => {
  peer = new RTCPeerConnection();
  // Synthetic silent audio tests the real transport without opening the user's microphone.
  context = new AudioContext(); destination = context.createMediaStreamDestination();
  oscillator = context.createOscillator(); const volume = context.createGain(); volume.gain.value = 0;
  oscillator.connect(volume).connect(destination); oscillator.start();
  peer.addTrack(destination.stream.getAudioTracks()[0], destination.stream);
  peer.createDataChannel('oai-events');
  peer.onconnectionstatechange = () => { window.voiceState = peer.connectionState; };
  await peer.setLocalDescription(await peer.createOffer());
  await window.voiceTest.start(peer.localDescription.sdp);
};
window.endTest = async () => { oscillator.stop(); peer.close(); await context.close(); };
window.speakTest = async base64 => { const bytes = Uint8Array.from(atob(base64), value => value.charCodeAt(0)); const source = context.createBufferSource(); source.buffer = await context.decodeAudioData(bytes.buffer); source.connect(destination); source.start(); };
</script>
