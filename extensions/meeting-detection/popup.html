<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalFlow calls</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>LocalFlow calls</h1><p id="status" role="status">Checking connection…</p><p>Copy a browser connection code from LocalFlow → Meetings, then paste it here.</p>
<form id="pair"><label for="code">Connection code</label><textarea id="code" rows="3" autocomplete="off" spellcheck="false" required></textarea><button type="submit">Connect</button></form>
<button id="disconnect" type="button" hidden>Disconnect</button><p class="privacy">Only call connection metadata stays on this computer. Recording starts after you accept in LocalFlow.</p><script src="popup.js"></script></body></html>
